site_name: Rule-ROM Philo — 可执行个性的哲学
site_url: https://philo.rulerom.com
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  custom_dir: overrides

plugins:
  - search
  - mermaid2

extra_css:
  - css/mermaid.css
  - assets/rulerom.css

extra:
  analytics:
    provider: yandex
    property: 107711657

nav:
  - 主页: index.md
  - 基础:
      - 架构师与 baker: base/architect.md
      - 个性: base/personality.md
      - 八条 VSB 线: base/vsb-life.md
      - 反应区间: base/detector-antagonist.md
      - Substrate: base/substrate.md
  - 架构:
      - 确定性: arch/determenism.md
      - 许可图: arch/relay.md
      - VSB 与 BUS16: arch/father-bus.md
  - 实践:
      - Whaler: world/whaler.md
  - 哲学模型:
      - 冯内古特与鲁迪·格茨: world/piano14.md
      - 成瘾与爱: world/addict.md
  - Nomos:
      - 架构宣言: nomos/about.md
      - 架构治理: nomos/control.md
  - 生态系统: ecosystem.md
