site_name: Rule-ROM Philo — философия исполняемой личности
site_url: https://philo.rulerom.com
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  custom_dir: overrides

plugins:
  - search
  - mermaid2

extra_css:
  - css/mermaid.css
  - assets/rulerom.css

extra:
  analytics:
    provider: yandex
    property: 107711657

nav:
  - Главная: index.md
  - Фундамент:
      - Архитектор и пекарь: base/architect.md
      - Личность: base/personality.md
      - Восемь струн VSB: base/vsb-life.md
      - Коридор реакции: base/detector-antagonist.md
      - Субстрат: base/substrate.md
  - Архитектура:
      - Детерминизм: arch/determenism.md
      - Граф допуска: arch/relay.md
      - VSB и BUS16: arch/father-bus.md
  - Практика:
      - Whaler: world/whaler.md
  - Архив метафор:
      - Земля как Training Phase: world/earth.md
      - Воннегут и Руди Герц: world/piano14.md
      - Зависимость и любовь: world/addict.md
  - Номос:
      - Архитектурный манифест: nomos/about.md
      - Архитектурное управление: nomos/control.md
      - Суверенитет для авторов: nomos/suveren.md
  - Экосистема: ecosystem.md
